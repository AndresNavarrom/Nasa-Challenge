# Earth Jukebox: run, test and prepare the data with Docker only.
#
#   docker compose --profile '*' build     build every image (needs internet, do it before the demo)
#   docker compose up web                  interface with live reload on http://127.0.0.1:5173
#   docker compose run --rm web-test       Vitest suite (web/src/**/*.test.ts)
#   docker compose run --rm prep-test      cargo test for tools/prep
#   docker compose run --rm prep           regenerate web/public/data/ from data/prep-config.json
#   docker compose run --rm server-test    cargo test for server/
#   docker compose run --rm web npm run build && docker compose up server
#                                          built interface from the local server on http://127.0.0.1:8080
#
# There is no database. `web-test`, `prep-test`, `server-test`, `prep` and
# `server` sit behind profiles, so a plain `docker compose up` starts the
# interface only.
#
# The final app container (built interface + release server binary in one
# image) is added with Step 15 of the plan; it is not defined here yet.

name: earth-jukebox

x-web: &web
  build:
    context: ./web
    target: dev
  image: earth-jukebox-web:dev
  init: true
  volumes:
    # Live source, so the three of us edit on the host and the container reloads.
    - ./web:/app
    # Dependencies live in a named volume, never in the host tree. The image
    # entry point reinstalls them when package-lock.json changes.
    - web_node_modules:/app/node_modules

x-prep: &prep
  build:
    context: ./tools/prep
  image: earth-jukebox-prep:dev
  init: true
  working_dir: /work

x-server: &server
  build:
    context: ./server
  image: earth-jukebox-server:dev
  init: true
  working_dir: /work

services:
  web:
    <<: *web
    ports:
      # Published on the loopback interface only.
      - "127.0.0.1:5173:5173"
    environment:
      # File events do not always cross the bind mount on Docker Desktop;
      # polling makes live reload reliable.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"

  web-test:
    <<: *web
    profiles: ["test"]
    command: ["npm", "test"]

  prep-test:
    <<: *prep
    profiles: ["test"]
    volumes:
      - ./tools/prep:/work/tools/prep:ro
    command: ["cargo", "test", "--locked", "--manifest-path", "tools/prep/Cargo.toml"]

  server-test:
    <<: *server
    profiles: ["test"]
    volumes:
      - ./server:/work/server:ro
    command: ["cargo", "test", "--locked", "--manifest-path", "server/Cargo.toml"]

  server:
    <<: *server
    profiles: ["server"]
    volumes:
      - ./server:/work/server:ro
      # The interface built with `docker compose run --rm web npm run build`.
      - ./web/dist:/work/web/dist:ro
    environment:
      # Listen on every interface inside the container so the published port
      # reaches it; the port is published on the host's loopback only.
      JUKEBOX_HOST: "0.0.0.0"
      JUKEBOX_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    command: ["cargo", "run", "--locked", "--manifest-path", "server/Cargo.toml"]

  prep:
    <<: *prep
    profiles: ["data"]
    volumes:
      - ./tools/prep:/work/tools/prep:ro
      # Input: prep-config.json and the downloaded frames in data/raw/.
      - ./data:/work/data:ro
      # Output: grids, textures and manifest.json used by the interface.
      - ./web/public/data:/work/web/public/data
    entrypoint: ["cargo", "run", "--locked", "--manifest-path", "tools/prep/Cargo.toml", "--"]
    command: ["--config", "data/prep-config.json"]

volumes:
  web_node_modules:
