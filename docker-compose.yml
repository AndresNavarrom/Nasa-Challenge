# Earth Jukebox: run, test and prepare the data with Docker only.
#
#   docker compose --profile '*' build     build every image (needs internet, do it before the demo)
#   docker compose up                      the full app (built interface + local server) on http://127.0.0.1:8080
#   docker compose up web                  interface with live reload on http://127.0.0.1:5173
#   docker compose run --rm web-test       Vitest suite (web/src/**/*.test.ts)
#   docker compose run --rm prep-test      cargo test for tools/prep
#   docker compose run --rm server-test    cargo test for server/
#   docker compose run --rm fetch-test     pytest for the conversions in tools/fetch
#   docker compose run --rm fetch          download the sources into data/raw/ and rewrite
#                                          data/SOURCES.md (about 2.2 GB, needs internet);
#                                          also draws the sharp lightning dots of the planet
#                                          view, web/public/data/lightning-4k.png
#                                          (tools/fetch/lightning_dots.py)
#   docker compose run --rm fetch-gedi     download GEDI L3 forest height into data/raw/gedi/
#                                          (about 617 MB); needs a NASA Earthdata login in
#                                          ~/.netrc (only the urs.earthdata.nasa.gov line),
#                                          mounted read-only in this service only. Once
#                                          `prep` has run, it also writes the sharp forest
#                                          images web/public/data/forest-height-*.png
#   docker compose run --rm prep           regenerate web/public/data/ from data/prep-config.json
#   docker compose run --rm audio-prep     prepare data/audio/source into web/public/audio/
#                                          (Ogg Vorbis + manifest + credits)
#   docker compose run --rm scenes-prep    validate data/scenes and publish web/public/scenes
#   docker compose run --rm web npm run build && docker compose up server
#                                          dev server over web/dist on http://127.0.0.1:8081
#
# Data from scratch: `fetch`, `fetch-gedi`, `prep`, then `fetch-gedi` again (it only
# converts the second time: the GeoTIFF is already there).
#
# There is no database. Only `app` has no profile, so a plain `docker compose up`
# starts the full app and nothing else. Naming a service (`up web`, `run --rm
# web-test`) starts it whatever its profile.

name: earth-jukebox

x-web: &web
  build:
    context: ./web
    target: dev
  image: earth-jukebox-web:dev
  init: true
  volumes:
    # Live source, so the three of us edit on the host and the container reloads.
    - ./web:/app
    # Dependencies live in a named volume, never in the host tree. The image
    # entry point reinstalls them when package-lock.json changes.
    - web_node_modules:/app/node_modules

x-prep: &prep
  build:
    context: ./tools/prep
  image: earth-jukebox-prep:dev
  init: true
  working_dir: /work

x-server: &server
  build:
    context: ./server
  image: earth-jukebox-server:dev
  init: true
  working_dir: /work

x-fetch: &fetch
  build:
    context: ./tools/fetch
  image: earth-jukebox-fetch:dev
  init: true
  working_dir: /work
  environment:
    # The converters (oco2_to_png.py, merra2_smoke_to_png.py...) import each other and are imported by the tests.
    PYTHONPATH: /work/tools/fetch
    # The source is mounted read-only: no pytest cache, no .pyc files.
    PYTEST_ADDOPTS: "-p no:cacheprovider"
    PYTHONDONTWRITEBYTECODE: "1"

services:
  # The demo: one image with the built interface, its data and the release
  # server binary (Dockerfile at the repository root). Once built it needs no
  # internet. Rebuild it (`docker compose build app`) after any change to web/
  # or server/ so the image carries the latest code.
  app:
    build:
      context: .
      target: app
    image: earth-jukebox-app:latest
    init: true
    environment:
      # Listen on every interface inside the container so the published port
      # reaches it. The image itself defaults to 127.0.0.1 (see Dockerfile).
      JUKEBOX_HOST: "0.0.0.0"
    ports:
      # Published on the loopback interface only.
      - "127.0.0.1:8080:8080"
    restart: "no"

  web:
    <<: *web
    profiles: ["dev"]
    ports:
      # Published on the loopback interface only.
      - "127.0.0.1:5173:5173"
    environment:
      # File events do not always cross the bind mount on Docker Desktop;
      # polling makes live reload reliable.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"

  web-test:
    <<: *web
    profiles: ["test"]
    command: ["npm", "test"]

  prep-test:
    <<: *prep
    profiles: ["test"]
    volumes:
      - ./tools/prep:/work/tools/prep:ro
    command: ["cargo", "test", "--locked", "--manifest-path", "tools/prep/Cargo.toml"]

  server-test:
    <<: *server
    profiles: ["test"]
    volumes:
      - ./server:/work/server:ro
    command: ["cargo", "test", "--locked", "--manifest-path", "server/Cargo.toml"]

  # Development run of the server: compiles the mounted server/ source and
  # serves web/dist from the host, built with `docker compose run --rm web npm
  # run build`. Port 8081 so it can run next to `app`.
  server:
    <<: *server
    profiles: ["dev"]
    volumes:
      - ./server:/work/server:ro
      # The whole web/ folder, read-only, so Docker never has to create
      # web/dist on the host (an empty, root-owned folder there would get in
      # the way of `npm run build`). If web/dist is missing, the server says so
      # and stops. Build it first with `docker compose run --rm web npm run build`.
      - ./web:/work/web:ro
    environment:
      # Listen on every interface inside the container so the published port
      # reaches it; the port is published on the host's loopback only.
      JUKEBOX_HOST: "0.0.0.0"
      JUKEBOX_PORT: "8080"
    ports:
      - "127.0.0.1:8081:8080"
    command: ["cargo", "run", "--locked", "--manifest-path", "server/Cargo.toml"]

  prep:
    <<: *prep
    profiles: ["data"]
    volumes:
      - ./tools/prep:/work/tools/prep:ro
      # Input: prep-config.json and the downloaded frames in data/raw/.
      - ./data:/work/data:ro
      # Output: grids, textures and manifest.json used by the interface.
      - ./web/public/data:/work/web/public/data
    # Release build: 24 smoke instants at 1440 x 720 and an 8192-pixel base
    # image are too slow to prepare with the test profile.
    entrypoint: ["cargo", "run", "--release", "--locked", "--manifest-path", "tools/prep/Cargo.toml", "--"]
    command: ["--config", "data/prep-config.json"]

  fetch-test:
    <<: *fetch
    profiles: ["test"]
    volumes:
      - ./tools/fetch:/work/tools/fetch:ro
    command: ["pytest", "-q", "tools/fetch/tests"]

  fetch:
    <<: *fetch
    profiles: ["data"]
    volumes:
      - ./tools:/work/tools:ro
      # Output: the downloaded and converted sources in data/raw/ and data/SOURCES.md.
      - ./data:/work/data
      # Output: lightning-4k.png, the lightning dots drawn on the planet (not used by
      # the sound). Nothing else in this folder is written by this service.
      - ./web/public/data:/work/web/public/data

  audio-prep:
    <<: *fetch
    profiles: ["data"]
    volumes:
      - ./tools:/work/tools:ro
      - ./data:/work/data:ro
      # Output: the prepared library, its manifest and the credits document.
      - ./web/public/audio:/work/web/public/audio
      - ./docs:/work/docs
    command: ["python", "tools/audio/prepare.py"]

  scenes-prep:
    <<: *fetch
    profiles: ["data"]
    volumes:
      - ./tools:/work/tools:ro
      - ./data:/work/data:ro
      - ./web/public/data:/work/web/public/data:ro
      - ./web/public/audio:/work/web/public/audio:ro
      # Output: the scene images, loops and manifest, shipped with the app.
      - ./web/public/scenes:/work/web/public/scenes
    command: ["python", "tools/scenes/prepare.py"]

  # GEDI L3 canopy height: the only source behind a NASA Earthdata login, so it has
  # its own service and `fetch` needs no account.
  fetch-gedi:
    <<: *fetch
    profiles: ["data"]
    volumes:
      - ./tools:/work/tools:ro
      # Output: data/raw/gedi/ (the GeoTIFF and the converted PNG).
      - ./data:/work/data
      # Input: manifest.json and forest_global.bin from `prep`. Output: the sharp
      # forest images forest-height-8k.png, -4k.png and -amazon.png (gedi_visual.py).
      - ./web/public/data:/work/web/public/data
      # The Earthdata login, read-only and only in this service. If ~/.netrc is
      # missing Docker stops with an error naming it instead of creating a folder.
      # `~` (not ${HOME}) so Windows PowerShell, which has no HOME, shows no
      # warning on every docker compose command. Keep only the
      # urs.earthdata.nasa.gov line in this file: the container sees all of it.
      - type: bind
        source: ~/.netrc
        target: /root/.netrc
        read_only: true
        bind:
          create_host_path: false
    command: ["bash", "tools/fetch/fetch-gedi.sh"]

  # OCO-2 GEOS daily CO2 (NASA GES DISC): behind the same Earthdata login as GEDI,
  # with the "NASA GESDISC DATA ARCHIVE" application authorised in the profile.
  fetch-oco2:
    <<: *fetch
    profiles: ["data"]
    volumes:
      - ./tools:/work/tools:ro
      # Output: data/raw/oco2/ (the daily NetCDF files and their grey images).
      - ./data:/work/data
      # The Earthdata login, read-only and only in this service (see fetch-gedi).
      - type: bind
        source: ~/.netrc
        target: /root/.netrc
        read_only: true
        bind:
          create_host_path: false
    command: ["bash", "tools/fetch/fetch-oco2.sh"]

  # MERRA-2 smoke (organic + black carbon optical depth, NASA GES DISC): same
  # Earthdata login and GES DISC authorisation as OCO-2.
  fetch-merra2:
    <<: *fetch
    profiles: ["data"]
    volumes:
      - ./tools:/work/tools:ro
      # Output: data/raw/merra2/ (the daily smoke files and their grey images).
      - ./data:/work/data
      # The Earthdata login, read-only and only in this service (see fetch-gedi).
      - type: bind
        source: ~/.netrc
        target: /root/.netrc
        read_only: true
        bind:
          create_host_path: false
    command: ["bash", "tools/fetch/fetch-merra2.sh"]

volumes:
  web_node_modules:
