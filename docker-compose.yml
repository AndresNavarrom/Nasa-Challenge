# Earth Jukebox: run, test and prepare the data with Docker only.
#
#   docker compose --profile '*' build     build every image (needs internet, do it before the demo)
#   docker compose up web                  interface with live reload on http://127.0.0.1:5173
#   docker compose run --rm web-test       Vitest suite (web/src/**/*.test.ts)
#   docker compose run --rm prep-test      cargo test for tools/prep
#   docker compose run --rm fetch-test     pytest for the conversions in tools/fetch
#   docker compose run --rm fetch          download the sources into data/raw/ and rewrite
#                                          data/SOURCES.md (about 1.9 GB, needs internet)
#   docker compose run --rm fetch-gedi     download GEDI L3 forest height into data/raw/gedi/
#                                          (about 617 MB); needs a NASA Earthdata login in
#                                          ~/.netrc, mounted read-only in this service only
#   docker compose run --rm prep           regenerate web/public/data/ from data/prep-config.json
#
# Data from scratch: `fetch`, `fetch-gedi`, then `prep`. There is no database.
# `web-test`, `prep-test`, `fetch-test`, `fetch`, `fetch-gedi` and `prep` are
# one-off jobs behind profiles, so a plain `docker compose up` starts the
# interface only.
#
# The final app container (built interface + the Rust local server in server/)
# is added with Steps 11 and 15 of the plan; it is not defined here yet.

name: earth-jukebox

x-web: &web
  build:
    context: ./web
    target: dev
  image: earth-jukebox-web:dev
  init: true
  volumes:
    # Live source, so the three of us edit on the host and the container reloads.
    - ./web:/app
    # Dependencies live in a named volume, never in the host tree. The image
    # entry point reinstalls them when package-lock.json changes.
    - web_node_modules:/app/node_modules

x-prep: &prep
  build:
    context: ./tools/prep
  image: earth-jukebox-prep:dev
  init: true
  working_dir: /work

x-fetch: &fetch
  build:
    context: ./tools/fetch
  image: earth-jukebox-fetch:dev
  init: true
  working_dir: /work
  environment:
    # geoscf_to_png.py is imported by the tests and run by fetch-frames.sh.
    PYTHONPATH: /work/tools/fetch
    # The source is mounted read-only: no pytest cache, no .pyc files.
    PYTEST_ADDOPTS: "-p no:cacheprovider"
    PYTHONDONTWRITEBYTECODE: "1"

services:
  web:
    <<: *web
    ports:
      # Published on the loopback interface only.
      - "127.0.0.1:5173:5173"
    environment:
      # File events do not always cross the bind mount on Docker Desktop;
      # polling makes live reload reliable.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"

  web-test:
    <<: *web
    profiles: ["test"]
    command: ["npm", "test"]

  prep-test:
    <<: *prep
    profiles: ["test"]
    volumes:
      - ./tools/prep:/work/tools/prep:ro
    command: ["cargo", "test", "--locked", "--manifest-path", "tools/prep/Cargo.toml"]

  prep:
    <<: *prep
    profiles: ["data"]
    volumes:
      - ./tools/prep:/work/tools/prep:ro
      # Input: prep-config.json and the downloaded frames in data/raw/.
      - ./data:/work/data:ro
      # Output: grids, textures and manifest.json used by the interface.
      - ./web/public/data:/work/web/public/data
    # Release build: 24 smoke instants at 1440 x 720 and an 8192-pixel base
    # image are too slow to prepare with the test profile.
    entrypoint: ["cargo", "run", "--release", "--locked", "--manifest-path", "tools/prep/Cargo.toml", "--"]
    command: ["--config", "data/prep-config.json"]

  fetch-test:
    <<: *fetch
    profiles: ["test"]
    volumes:
      - ./tools/fetch:/work/tools/fetch:ro
    command: ["pytest", "-q", "tools/fetch/tests"]

  fetch:
    <<: *fetch
    profiles: ["data"]
    volumes:
      - ./tools:/work/tools:ro
      # Output: the downloaded and converted sources in data/raw/ and data/SOURCES.md.
      - ./data:/work/data

  # GEDI L3 canopy height: the only source behind a NASA Earthdata login, so it has
  # its own service and `fetch` needs no account.
  fetch-gedi:
    <<: *fetch
    profiles: ["data"]
    volumes:
      - ./tools:/work/tools:ro
      # Output: data/raw/gedi/ (the GeoTIFF and the converted PNG).
      - ./data:/work/data
      # The Earthdata login, read-only and only in this service. If ~/.netrc is
      # missing Docker stops with an error naming it instead of creating a folder.
      - type: bind
        source: ${HOME}/.netrc
        target: /root/.netrc
        read_only: true
        bind:
          create_host_path: false
    command: ["bash", "tools/fetch/fetch-gedi.sh"]

volumes:
  web_node_modules:
