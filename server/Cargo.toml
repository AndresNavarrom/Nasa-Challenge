[package]
name = "jukebox-server"
version = "0.1.0"
edition = "2021"
description = "Local static file server for the Earth Jukebox demo (binds to 127.0.0.1 only)"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
