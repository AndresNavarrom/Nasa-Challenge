[package]
name = "jukebox-prep"
version = "0.1.0"
edition = "2021"
description = "Turns NASA SVS visualization frames into intensity grids for the Earth Jukebox web app"
license = "MIT"
publish = false

[[bin]]
name = "jukebox-prep"
path = "src/main.rs"

[dependencies]
# Default features cover png, jpeg, tiff and OpenEXR decoding.
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Grids are written gzip-compressed (.bin.gz); the app inflates them in the browser.
flate2 = "1"

[profile.dev]
# Image resampling is very slow without optimisation.
opt-level = 2
